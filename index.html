<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/icon-1.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="საქართველოს სკაუტური მოძრაობის სამეგრელოს ორგანიზაცია - იყავი მზად! გახდი სკაუტი!" />
    <meta name="theme-color" content="#0d0a1a" />
    <title>სამეგრელოს სკაუტები | Scouts of Samegrelo</title>
    <script>
      if (location.hash) {
        history.replaceState(null, '', location.pathname + location.search);
      }
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
    </script>
    <style>
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background: #0d0a1a url("/assets/photos/first.jpg") center / cover no-repeat;
      }
      #root:empty::after {
        content: "Scouts of Samegrelo";
        position: fixed;
        left: 50%;
        top: 50%;
        z-index: 1;
        width: min(78vw, 720px);
        transform: translate(-50%, -50%);
        padding: 32px 24px;
        border: 1px solid rgba(139, 108, 196, 0.3);
        border-radius: 24px;
        background: rgba(45, 31, 78, 0.65);
        color: #fff;
        font: 700 clamp(1.7rem, 6vw, 3rem) system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        box-shadow: 0 20px 50px rgba(13, 10, 26, 0.5);
      }
    </style>
    <!-- Hero image preload -->
    <link rel="preload" as="image" href="/assets/photos/first.jpg" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/Main/main.jsx"></script>
  </body>
</html>
